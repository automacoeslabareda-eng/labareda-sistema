<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal — Sítio Labareda</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 61,35 95,35 67,55 78,85 50,67 22,85 33,55 5,35 39,35' fill='%23C45D3E'/></svg>">
  <link rel="preconnect" href="https://wgvqiguebiqhubhtwfhz.supabase.co">
  <style>
    /* ---------- Fontes da marca ---------- */
    @font-face { font-family:'Costa'; src:url('fonts/Costa.otf') format('opentype'); font-display:swap; }
    @font-face { font-family:'Ocotillo'; src:url('fonts/OcotilloPortugues.otf') format('opentype'); font-display:swap; }
    @font-face { font-family:'JetBrains Mono'; src:url('fonts/JetBrainsMono-VariableFont_wght.ttf') format('truetype'); font-weight:100 800; font-display:swap; }

    :root {
      --terracota:#AA3424; --cacau:#2E2624; --creme:#F3E9D2; --areia:#E9BF91;
      --tan:#DBBD92; --moldura:#EBD9B8;
      --disp:'Ocotillo','Costa',Georgia,serif;
      --mono:'JetBrains Mono',ui-monospace,monospace;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body {
      font-family:var(--mono);
      color:var(--cacau);
      background:#1c1712;
    }
    a { color:inherit; }

    /* ===== Cabeçalho vermelho ===== */
    .jp-header {
      position:relative;
      background:var(--terracota) url('img/textures/VERMELHO.jpg');
      background-size:1920px auto; background-position:center top; background-repeat:repeat;
      color:var(--creme);
      text-align:center;
      padding:44px 70px 32px;
    }
    .jp-header__logo {
      font-family:var(--disp);
      font-size:clamp(2.8rem,7vw,4.8rem);
      letter-spacing:.06em;
      padding-right:.06em; /* compensa letter-spacing para centralizar */
      line-height:1;
      color:var(--creme);
    }
    .jp-header__sub {
      margin-top:18px;
      font-size:.58rem; letter-spacing:.38em;
      line-height:2.4;
      opacity:.92;
      text-transform:uppercase;
    }
    .jp-header__sub .row {
      display:block; text-align:center;
      padding-right:.38em; /* compensa letter-spacing do ultimo char */
    }
    .jp-header__sub .spread {
      display:grid; grid-template-columns:1fr 1fr;
      gap:0; column-gap:min(16vw,160px);
      max-width:500px; margin:0 auto;
      padding-right:.38em;
    }
    .jp-header__sub .spread span:first-child { text-align:right; }
    .jp-header__sub .spread span:last-child { text-align:left; }
    /* JOURNAL vertical nas laterais */
    .jp-vert {
      position:absolute; top:50%; transform:translateY(-50%);
      writing-mode:vertical-rl; text-orientation:upright;
      font-size:.6rem; letter-spacing:.55em;
      color:var(--creme); opacity:.9;
    }
    .jp-vert--l { left:18px; transform:translateY(-50%) rotate(180deg); }
    .jp-vert--r { right:18px; }

    /* ===== Faixa meta (data / apresenta / nº) ===== */
    .jp-meta {
      background:var(--tan) url('img/textures/BEGE.jpg');
      background-size:1920px auto; background-repeat:repeat;
      display:flex; align-items:center; justify-content:space-between;
      padding:12px clamp(20px,6vw,80px);
      font-size:.6rem; letter-spacing:.28em; text-transform:uppercase;
      color:#5b4a3c;
      border-bottom:1px solid rgba(46,38,36,.18);
    }

    /* ===== Corpo (imagens) ===== */
    .jp-body {
      background:var(--tan) url('img/textures/BEGE.jpg');
      background-size:1920px auto; background-repeat:repeat;
      padding:44px clamp(20px,6vw,80px) 60px;
    }
    .jp-title {
      font-family:var(--disp);
      text-align:center;
      font-size:clamp(1rem,2.2vw,1.3rem);
      letter-spacing:.14em; text-transform:uppercase;
      color:var(--cacau);
      margin:6px auto 44px;
      padding-bottom:10px;
      width:fit-content;
      border-bottom:1.5px solid var(--cacau);
    }

    /* moldura reutilizável (passe-partout claro) */
    .jp-frame {
      background:var(--moldura);
      padding:14px;
      border:1px solid rgba(46,38,36,.35);
      box-shadow:0 8px 26px rgba(0,0,0,.14);
    }
    .jp-frame img, .jp-frame video {
      display:block; width:100%; height:auto;
    }
    .jp-cap {
      font-family:var(--disp);
      font-size:.82rem; line-height:1.9; text-align:center;
      color:#4f4034; max-width:520px; margin:18px auto 0;
    }

    .jp-figure { margin:0 auto; }
    /* texto do conteúdo */
    .jp-texto {
      max-width:520px; margin:0 auto 52px;
      font-family:var(--disp);
      font-size:.82rem; line-height:2; color:#3a3028;
      text-align:center;
    }
    .jp-texto p { margin-bottom:1.4em; }
    .jp-texto p:last-child { margin-bottom:0; }

    .jp-figure--hero { max-width:520px; margin:0 auto 52px; }
    /* primeira imagem: comprida/vertical (retrato) */
    .jp-figure--hero .jp-frame img { aspect-ratio:4/5; object-fit:cover; }
    /* demais imagens: retrato tambem, para ficar consistente com o exemplo */
    .jp-grid .jp-frame img { aspect-ratio:3/4; object-fit:cover; }
    .jp-grid {
      display:grid; grid-template-columns:repeat(2,1fr);
      gap:40px 48px; max-width:820px; margin:0 auto;
    }
    @media (max-width:640px){ .jp-grid{ grid-template-columns:1fr; } }

    /* ===== Vídeo (fundo escuro) ===== */
    .jp-video-wrap {
      background:var(--cacau) url('img/textures/CACAU.jpg');
      background-size:1920px auto; background-repeat:repeat;
      padding:70px clamp(20px,6vw,80px);
    }
    .jp-video {
      max-width:820px; margin:0 auto;
    }
    .jp-video .jp-frame { background:var(--areia); }
    .jp-ratio {
      position:relative; width:100%; padding-top:56.25%;
      background:#000; overflow:hidden;
    }
    .jp-ratio iframe, .jp-ratio video {
      position:absolute; inset:0; width:100%; height:100%; border:0;
    }

    /* ===== Rodapé / voltar ===== */
    .jp-back {
      display:inline-flex; align-items:center; gap:8px;
      margin:0 auto; padding:14px 30px;
      border:1px solid var(--creme); color:var(--creme);
      background:transparent; cursor:pointer;
      font-family:var(--mono); font-size:.72rem; letter-spacing:.2em; text-transform:uppercase;
      text-decoration:none;
    }
    .jp-back:hover { background:var(--creme); color:var(--cacau); }
    .jp-foot {
      background:var(--cacau); text-align:center; padding:40px 0 60px;
    }

    .jp-loading, .jp-erro {
      min-height:70vh; display:flex; align-items:center; justify-content:center;
      color:var(--creme); font-size:.9rem; letter-spacing:.1em; text-align:center; padding:40px;
    }
    .jp-hidden { display:none !important; }
  </style>
</head>
<body>
  <div id="jp-loading" class="jp-loading">Carregando journal…</div>

  <article id="jp-content" class="jp-hidden">
    <!-- Cabeçalho -->
    <header class="jp-header">
      <span class="jp-vert jp-vert--l">JOURNAL</span>
      <span class="jp-vert jp-vert--r">JOURNAL</span>
      <div class="jp-header__logo">LABAREDA</div>
      <div class="jp-header__sub">
        <span class="row">Mata Atlântica</span>
        <span class="row spread"><span>Serra Grande</span><span>Bahia</span></span>
        <span class="row">Grande Brasil</span>
      </div>
    </header>

    <!-- Meta -->
    <div class="jp-meta">
      <span id="jp-data">—</span>
      <span>Apresenta</span>
      <span id="jp-num">Nº 001</span>
    </div>

    <!-- Corpo -->
    <section class="jp-body" id="jp-body">
      <h1 class="jp-title" id="jp-title">—</h1>
      <div id="jp-imagens"></div>
      <div id="jp-texto" class="jp-texto"></div>
    </section>

    <!-- Vídeo -->
    <section class="jp-video-wrap jp-hidden" id="jp-video-sec">
      <div class="jp-video">
        <div class="jp-frame">
          <div class="jp-ratio" id="jp-video-box"></div>
        </div>
      </div>
    </section>

    <!-- Voltar -->
    <footer class="jp-foot">
      <a class="jp-back" href="index.html#journal">← Voltar ao site</a>
    </footer>
  </article>

  <div id="jp-erro" class="jp-erro jp-hidden">Journal não encontrado.<br><a class="jp-back" style="margin-top:20px" href="index.html#journal">← Voltar</a></div>

  <script>
    (function () {
      var SUPABASE_URL = 'https://wgvqiguebiqhubhtwfhz.supabase.co';
      var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndndnFpZ3VlYmlxaHViaHR3Zmh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI5MjE1NTIsImV4cCI6MjA5ODQ5NzU1Mn0.FEALNU6X_sXkJlaXlfLizkzGUI8kD6TbIU88LmAyn7w';

      var params = new URLSearchParams(location.search);
      var slug = params.get('slug');
      var lang = (params.get('lang') === 'en') ? 'en' : 'pt';

      function esc(s) {
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      function formatarData(iso) {
        if (!iso) return '';
        var d = new Date(iso);
        if (isNaN(d)) return '';
        var meses = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
        return d.getDate() + ' DE ' + meses[d.getMonth()] + ' ' + d.getFullYear();
      }

      function youtubeId(url) {
        if (!url) return null;
        var m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
        return m ? m[1] : null;
      }

      function mostrarErro() {
        document.getElementById('jp-loading').classList.add('jp-hidden');
        document.getElementById('jp-erro').classList.remove('jp-hidden');
      }

      if (!slug) { mostrarErro(); return; }

      var url = SUPABASE_URL + '/rest/v1/journal_posts?slug=eq.' + encodeURIComponent(slug)
        + '&publicado=eq.true&select=*&limit=1';

      fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data || !data.length) { mostrarErro(); return; }
          render(data[0]);
        })
        .catch(function () { mostrarErro(); });

      function pick(obj, base) {
        return (lang === 'en')
          ? (obj[base + '_en'] || obj[base + '_pt'] || obj[base] || '')
          : (obj[base + '_pt'] || obj[base + '_en'] || obj[base] || '');
      }

      function render(post) {
        var titulo = pick(post, 'titulo') || 'Journal';
        document.title = titulo + ' — Sítio Labareda';
        document.getElementById('jp-title').textContent = titulo;
        document.getElementById('jp-data').textContent = formatarData(post.published_at || post.created_at);

        /* ----- imagens de conteúdo ----- */
        var imagens = post.imagens;
        if (typeof imagens === 'string') { try { imagens = JSON.parse(imagens); } catch (e) { imagens = []; } }
        if (!Array.isArray(imagens)) imagens = [];

        /* normaliza: aceita string ou objeto {url, descricao_pt, descricao_en} */
        var itens = imagens.map(function (it) {
          if (typeof it === 'string') return { url: it, descricao: '' };
          var desc = (lang === 'en')
            ? (it.descricao_en || it.descricao_pt || it.descricao || '')
            : (it.descricao_pt || it.descricao_en || it.descricao || '');
          return { url: it.url || it.imagem || '', descricao: desc };
        }).filter(function (it) { return it.url; });

        var bodyEl = document.getElementById('jp-body');
        var imgWrap = document.getElementById('jp-imagens');

        if (itens.length === 0) {
          /* sem imagens: mantém título, apenas não mostra imagens (fica título + vídeo) */
          imgWrap.innerHTML = '';
          if (post.video_url) bodyEl.style.paddingBottom = '20px';
        } else {
          var html = '';
          /* primeira imagem = destaque grande */
          html += '<figure class="jp-figure jp-figure--hero">'
            + '<div class="jp-frame"><img src="' + esc(itens[0].url) + '" alt="' + esc(titulo) + '" loading="lazy"></div>'
            + (itens[0].descricao ? '<figcaption class="jp-cap">' + esc(itens[0].descricao) + '</figcaption>' : '')
            + '</figure>';
          /* demais em grade 2 colunas */
          if (itens.length > 1) {
            html += '<div class="jp-grid">';
            for (var i = 1; i < itens.length; i++) {
              html += '<figure class="jp-figure">'
                + '<div class="jp-frame"><img src="' + esc(itens[i].url) + '" alt="' + esc(titulo) + '" loading="lazy"></div>'
                + (itens[i].descricao ? '<figcaption class="jp-cap">' + esc(itens[i].descricao) + '</figcaption>' : '')
                + '</figure>';
            }
            html += '</div>';
          }
          imgWrap.innerHTML = html;
        }

        /* ----- texto do conteúdo ----- */
        var conteudo = pick(post, 'conteudo');
        var textoEl = document.getElementById('jp-texto');
        if (conteudo) {
          var paragrafos = conteudo.split(/\n\s*\n/);
          textoEl.innerHTML = paragrafos.map(function (p) {
            return '<p>' + esc(p.trim()) + '</p>';
          }).filter(function (p) { return p !== '<p></p>'; }).join('');
        }

        /* ----- vídeo ----- */
        var video = post.video_url;
        if (video) {
          var box = document.getElementById('jp-video-box');
          var yt = youtubeId(video);
          if (yt) {
            box.innerHTML = '<iframe src="https://www.youtube.com/embed/' + yt + '" title="Vídeo" '
              + 'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" '
              + 'allowfullscreen></iframe>';
          } else {
            box.innerHTML = '<video src="' + esc(video) + '" controls preload="metadata"></video>';
          }
          document.getElementById('jp-video-sec').classList.remove('jp-hidden');
        }

        document.getElementById('jp-loading').classList.add('jp-hidden');
        document.getElementById('jp-content').classList.remove('jp-hidden');
      }
    })();
  </script>
</body>
</html>
