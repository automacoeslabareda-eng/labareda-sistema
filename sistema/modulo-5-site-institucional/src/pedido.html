<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acompanhar Pedido — Sítio Labareda</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 61,35 95,35 67,55 78,85 50,67 22,85 33,55 5,35 39,35' fill='%23C45D3E'/></svg>">
  <style>
    @font-face { font-family:'Ocotillo'; src:url('fonts/OcotilloPortugues.otf') format('opentype'); font-display:swap; }
    @font-face { font-family:'JetBrains Mono'; src:url('fonts/JetBrainsMono-VariableFont_wght.ttf') format('truetype'); font-weight:100 800; font-display:swap; }
    :root {
      --terracota:#AA3424; --cacau:#2E2624; --creme:#F3E9D2; --areia:#E9BF91;
      --verde:#3D8B37; --amarelo:#D4A017;
      --disp:'Ocotillo',Georgia,serif;
      --mono:'JetBrains Mono',monospace;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:var(--mono); color:var(--cacau); background:var(--creme); min-height:100vh; }
    a { color:var(--terracota); }

    .header {
      background:var(--terracota); color:var(--creme); text-align:center;
      padding:30px 20px;
    }
    .header h1 { font-family:var(--disp); font-size:2rem; letter-spacing:.06em; }
    .header p { font-size:.75rem; letter-spacing:.2em; text-transform:uppercase; margin-top:8px; opacity:.85; }

    .container { max-width:560px; margin:0 auto; padding:40px 20px 60px; }

    /* Form de busca */
    .search-box { text-align:center; margin-bottom:30px; }
    .search-box label { display:block; font-size:.85rem; letter-spacing:.1em; text-transform:uppercase; margin-bottom:12px; color:#5b4a3c; }
    .search-row { display:flex; gap:10px; }
    .search-input {
      flex:1; padding:14px 18px; border:1.5px solid rgba(46,38,36,.3); background:#fff;
      font-family:var(--mono); font-size:1.1rem; text-align:center; letter-spacing:.15em;
      outline:none; transition:border-color .2s;
    }
    .search-input:focus { border-color:var(--terracota); }
    .search-btn {
      padding:14px 24px; background:var(--terracota); color:var(--creme); border:none;
      font-family:var(--mono); font-size:.85rem; letter-spacing:.1em; text-transform:uppercase;
      cursor:pointer; transition:background .2s;
    }
    .search-btn:hover { background:#8b2a1a; }

    /* Status */
    .result { display:none; }
    .result.show { display:block; }

    .status-bar {
      display:flex; justify-content:space-between; align-items:center;
      padding:18px 22px; margin-bottom:24px;
      border:1.5px solid rgba(46,38,36,.2); background:#fff;
    }
    .status-label { font-size:.7rem; letter-spacing:.15em; text-transform:uppercase; color:#8a7b6d; }
    .status-value { font-size:1rem; font-weight:700; }
    .status-pendente { color:#b58a2a; }
    .status-pago { color:var(--verde); }
    .status-preparando { color:var(--amarelo); }
    .status-enviado { color:#2a6bb5; }
    .status-entregue { color:var(--verde); }
    .status-cancelado { color:#b52a2a; }

    .pedido-numero { font-family:var(--disp); font-size:1.4rem; text-align:center; margin-bottom:20px; color:var(--cacau); }

    /* Timeline */
    .timeline { display:flex; justify-content:space-between; margin:30px 0; position:relative; }
    .timeline::before {
      content:''; position:absolute; top:14px; left:10%; right:10%;
      height:2px; background:rgba(46,38,36,.15);
    }
    .timeline-step { text-align:center; position:relative; z-index:1; flex:1; }
    .timeline-dot {
      width:28px; height:28px; border-radius:50%; margin:0 auto 8px;
      border:2px solid rgba(46,38,36,.2); background:var(--creme);
      display:flex; align-items:center; justify-content:center;
      font-size:.7rem;
    }
    .timeline-step.done .timeline-dot { background:var(--verde); border-color:var(--verde); color:#fff; }
    .timeline-step.active .timeline-dot { background:var(--terracota); border-color:var(--terracota); color:#fff; animation:pulse 1.5s infinite; }
    .timeline-label { font-size:.6rem; letter-spacing:.08em; text-transform:uppercase; color:#8a7b6d; }
    .timeline-step.done .timeline-label, .timeline-step.active .timeline-label { color:var(--cacau); font-weight:700; }

    @keyframes pulse { 0%,100% { box-shadow:0 0 0 0 rgba(170,52,36,.3); } 50% { box-shadow:0 0 0 8px rgba(170,52,36,0); } }

    /* Rastreio */
    .rastreio-box {
      padding:20px; margin:24px 0;
      border:2px solid #2a6bb5; background:rgba(42,107,181,.06);
      text-align:center;
    }
    .rastreio-box h3 { font-size:.75rem; letter-spacing:.15em; text-transform:uppercase; color:#2a6bb5; margin-bottom:10px; }
    .rastreio-codigo { font-size:1.3rem; font-weight:700; letter-spacing:.2em; color:var(--cacau); margin-bottom:12px; }
    .rastreio-link {
      display:inline-block; padding:10px 20px; background:#2a6bb5; color:#fff;
      text-decoration:none; font-size:.8rem; letter-spacing:.1em; text-transform:uppercase;
      transition:background .2s;
    }
    .rastreio-link:hover { background:#1e5a9a; }

    /* Itens */
    .itens-box { margin:24px 0; }
    .itens-box h3 { font-size:.75rem; letter-spacing:.15em; text-transform:uppercase; color:#8a7b6d; margin-bottom:14px; border-bottom:1px solid rgba(46,38,36,.15); padding-bottom:8px; }
    .item-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid rgba(46,38,36,.08); font-size:.85rem; }
    .item-nome { flex:1; }
    .item-qtd { width:40px; text-align:center; color:#8a7b6d; }
    .item-preco { width:90px; text-align:right; font-weight:600; }

    .totais { margin:20px 0; padding:16px 0; border-top:2px solid rgba(46,38,36,.2); }
    .total-row { display:flex; justify-content:space-between; padding:4px 0; font-size:.85rem; }
    .total-row.grande { font-size:1.1rem; font-weight:700; margin-top:8px; padding-top:8px; border-top:1px solid rgba(46,38,36,.15); }

    .voltar { display:block; text-align:center; margin-top:30px; font-size:.8rem; letter-spacing:.1em; }

    .erro-msg { text-align:center; padding:20px; color:var(--terracota); font-size:.9rem; }

    @media (max-width:480px) {
      .search-row { flex-direction:column; }
      .timeline-label { font-size:.5rem; }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>LABAREDA</h1>
    <p>Acompanhar Pedido</p>
  </header>

  <div class="container">
    <div class="search-box">
      <label>Digite o número do seu pedido</label>
      <div class="search-row">
        <input type="text" class="search-input" id="input-numero" placeholder="Ex: 1001" inputmode="numeric" autofocus>
        <button class="search-btn" id="btn-buscar" onclick="buscarPedido()">Buscar</button>
      </div>
    </div>

    <div class="erro-msg" id="erro" style="display:none"></div>

    <div class="result" id="resultado">
      <div class="pedido-numero" id="pedido-titulo"></div>

      <div class="timeline" id="timeline">
        <div class="timeline-step" data-step="pendente">
          <div class="timeline-dot">1</div>
          <div class="timeline-label">Pedido</div>
        </div>
        <div class="timeline-step" data-step="pago">
          <div class="timeline-dot">2</div>
          <div class="timeline-label">Pago</div>
        </div>
        <div class="timeline-step" data-step="preparando">
          <div class="timeline-dot">3</div>
          <div class="timeline-label">Preparando</div>
        </div>
        <div class="timeline-step" data-step="enviado">
          <div class="timeline-dot">4</div>
          <div class="timeline-label">Enviado</div>
        </div>
        <div class="timeline-step" data-step="entregue">
          <div class="timeline-dot">5</div>
          <div class="timeline-label">Entregue</div>
        </div>
      </div>

      <div class="status-bar">
        <div>
          <div class="status-label">Status</div>
          <div class="status-value" id="status-texto"></div>
        </div>
        <div style="text-align:right">
          <div class="status-label">Data</div>
          <div id="pedido-data" style="font-size:.85rem"></div>
        </div>
      </div>

      <div class="rastreio-box" id="rastreio-box" style="display:none">
        <h3>Código de Rastreio</h3>
        <div class="rastreio-codigo" id="rastreio-codigo"></div>
        <a class="rastreio-link" id="rastreio-link" href="#" target="_blank">Rastrear nos Correios</a>
      </div>

      <div class="itens-box">
        <h3>Itens do Pedido</h3>
        <div id="itens-lista"></div>
      </div>

      <div class="totais">
        <div class="total-row"><span>Subtotal</span><span id="total-subtotal"></span></div>
        <div class="total-row"><span>Frete</span><span id="total-frete"></span></div>
        <div class="total-row grande"><span>Total</span><span id="total-total"></span></div>
      </div>

      <a class="voltar" href="index.html">← Voltar ao site</a>
    </div>
  </div>

  <script>
    function formatarMoeda(v) { return 'R$ ' + parseFloat(v || 0).toFixed(2).replace('.', ','); }
    function formatarData(iso) {
      if (!iso) return '';
      var d = new Date(iso);
      return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});
    }

    // Auto-buscar se vier com ?numero=XXX na URL
    var params = new URLSearchParams(location.search);
    var autoNumero = params.get('numero');
    if (autoNumero) {
      document.getElementById('input-numero').value = autoNumero;
      window.addEventListener('DOMContentLoaded', function() { buscarPedido(); });
    }

    function buscarPedido() {
      var numero = document.getElementById('input-numero').value.trim();
      if (!numero) return;

      var btn = document.getElementById('btn-buscar');
      var erro = document.getElementById('erro');
      var resultado = document.getElementById('resultado');
      btn.disabled = true; btn.textContent = '...';
      erro.style.display = 'none';
      resultado.classList.remove('show');

      fetch('/api/consultar-pedido', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ numero: numero })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        btn.disabled = false; btn.textContent = 'Buscar';

        if (data.erro) {
          erro.textContent = data.erro;
          erro.style.display = 'block';
          return;
        }

        var p = data.pedido;
        document.getElementById('pedido-titulo').textContent = 'Pedido #' + p.numero;

        // Status
        var statusEl = document.getElementById('status-texto');
        statusEl.textContent = p.status_texto;
        statusEl.className = 'status-value status-' + p.status;

        document.getElementById('pedido-data').textContent = formatarData(p.criado_em);

        // Timeline
        var steps = ['pendente','pago','preparando','enviado','entregue'];
        var currentIdx = steps.indexOf(p.status);
        if (p.status === 'cancelado') currentIdx = -1;
        document.querySelectorAll('.timeline-step').forEach(function(step, i) {
          step.classList.remove('done', 'active');
          if (i < currentIdx) step.classList.add('done');
          else if (i === currentIdx) step.classList.add('active');
        });

        // Rastreio
        var rastreioBox = document.getElementById('rastreio-box');
        if (p.codigo_rastreio) {
          document.getElementById('rastreio-codigo').textContent = p.codigo_rastreio;
          document.getElementById('rastreio-link').href = p.rastreio_url || '#';
          rastreioBox.style.display = 'block';
        } else {
          rastreioBox.style.display = 'none';
        }

        // Itens
        var itensHtml = '';
        (p.itens || []).forEach(function(item) {
          var nomeComTamanho = item.nome_produto + (item.tamanho ? ' (' + item.tamanho + ')' : '');
          itensHtml += '<div class="item-row">'
            + '<span class="item-nome">' + nomeComTamanho + '</span>'
            + '<span class="item-qtd">x' + item.quantidade + '</span>'
            + '<span class="item-preco">' + formatarMoeda(item.subtotal) + '</span>'
            + '</div>';
        });
        document.getElementById('itens-lista').innerHTML = itensHtml || '<p style="color:#8a7b6d;font-size:.85rem">Sem itens</p>';

        // Totais
        document.getElementById('total-subtotal').textContent = formatarMoeda(p.subtotal);
        document.getElementById('total-frete').textContent = formatarMoeda(p.frete);
        document.getElementById('total-total').textContent = formatarMoeda(p.total);

        resultado.classList.add('show');
      })
      .catch(function() {
        btn.disabled = false; btn.textContent = 'Buscar';
        erro.textContent = 'Erro de conexão. Tente novamente.';
        erro.style.display = 'block';
      });
    }

    // Enter para buscar
    document.getElementById('input-numero').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') buscarPedido();
    });
  </script>
</body>
</html>
