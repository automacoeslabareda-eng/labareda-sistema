# ============================================================
#  Config do site labareda-site (modulo 5) — site institucional + Loja (Shop)
#  Inclui as Netlify Functions do pagamento Mercado Pago.
#
#  IMPORTANTE: no Netlify, o projeto "labareda-site" deve ter
#  Base directory = sistema/modulo-5-site-institucional
#  Assim ele le ESTE arquivo (e nao afeta os outros sites do mesmo repo).
# ============================================================
[build]
  publish = "src"
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
