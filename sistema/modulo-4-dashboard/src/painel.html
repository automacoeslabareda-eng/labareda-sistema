<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#C45D3E">
  <title>Labareda - Painel do Colaborador</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,5 61,35 95,35 67,55 78,85 50,67 22,85 33,55 5,35 39,35' fill='%23C45D3E'/></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">

  <style>
    /* ---- Tokens ---- */
    :root {
      --bg: #f5f5f5;
      --card-bg: #ffffff;
      --card-border: #e0e0e0;
      --accent: #C45D3E;
      --accent-hover: #b04a2e;
      --text: #222222;
      --text-muted: #777;
      --success: #2e7d32;
      --success-bg: #e8f5e9;
      --pending-bg: #fff8e1;
      --pending-text: #e65100;
      --radius: 12px;
      --radius-sm: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,.08);
      --font: 'DM Sans', system-ui, -apple-system, sans-serif;
    }

    /* ---- Reset ---- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 16px; -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100dvh;
      -webkit-font-smoothing: antialiased;
    }

    .escondido { display: none !important; }

    /* ---- Login ---- */
    .login-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .login-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 40px rgba(0,0,0,.12);
      overflow: hidden;
    }

    .login-header {
      background: var(--accent);
      padding: 32px 24px 24px;
      text-align: center;
    }

    .login-header svg {
      width: 48px;
      height: 48px;
      margin-bottom: 12px;
    }

    .login-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }

    .login-header p {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.8);
      margin-top: 4px;
    }

    .login-body {
      padding: 24px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      background: #fff;
      color: var(--text);
      font-family: var(--font);
      font-size: 1rem;
      outline: none;
      transition: border-color .2s;
    }

    .form-group input:focus {
      border-color: var(--accent);
    }

    .form-group input::placeholder {
      color: #aaa;
    }

    .login-error {
      background: #3a1a1a;
      color: #e57373;
      padding: 10px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 16px;
      text-align: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 14px 24px;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .2s, opacity .2s;
      width: 100%;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn--primary {
      background: var(--accent);
      color: #fff;
    }

    .btn--primary:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .btn--secondary {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    .btn--secondary:hover {
      background: #2e2e2e;
    }

    .btn--sm {
      padding: 8px 14px;
      font-size: 0.85rem;
      width: auto;
    }

    /* ---- App (pos login) ---- */
    .app-screen {
      padding: 0 16px 100px;
      max-width: 600px;
      margin: 0 auto;
    }

    /* ---- Header ---- */
    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 16px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    .app-header__user {
      display: flex;
      flex-direction: column;
    }

    .app-header__nome {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .app-header__data {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .btn-sair {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-family: var(--font);
      font-size: 0.85rem;
      cursor: pointer;
      transition: color .2s, border-color .2s;
    }

    .btn-sair:hover {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ---- Barra de acoes ---- */
    .barra-acoes {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .barra-acoes__contagem {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* ---- Cards de tarefa ---- */
    .tarefa-lista {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tarefa-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      transition: border-color .2s;
    }

    .tarefa-card--concluido {
      border-color: #a5d6a7;
      background: #f1f8e9;
      opacity: 0.8;
    }

    .tarefa-card__topo {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .tarefa-card__check {
      flex-shrink: 0;
      width: 28px;
      height: 28px;
      border: 2px solid var(--card-border);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all .2s;
      background: transparent;
      margin-top: 2px;
      font-size: 1rem;
    }

    .tarefa-card__check:hover {
      border-color: var(--success);
    }

    .tarefa-card__check--done {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .tarefa-card__info {
      flex: 1;
      min-width: 0;
    }

    .tarefa-card__descricao {
      font-size: 0.95rem;
      font-weight: 500;
      line-height: 1.4;
      word-break: break-word;
    }

    .tarefa-card__descricao--done {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .tarefa-card__pai {
      font-size: 0.78rem;
      color: var(--accent);
      margin-top: 4px;
    }

    .tarefa-card__topo {
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .tarefa-card__hora {
      font-size: 0.7rem;
      color: var(--success);
      margin-left: 6px;
    }

    .tarefa-card__icons {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-left: auto;
      flex-shrink: 0;
    }

    .icon-btn {
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.4;
      transition: opacity 0.2s;
      padding: 4px;
    }
    .icon-btn:hover, .icon-btn:active {
      opacity: 1;
    }

    .tarefa-card__indicadores {
      display: flex;
      gap: 8px;
      padding: 4px 0 0 44px;
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .indicador {
      opacity: 0.6;
    }

    /* ---- Tudo feito banner ---- */
    .tudo-feito {
      text-align: center;
      padding: 24px;
      margin-bottom: 20px;
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      border: 1px solid #a5d6a7;
      border-radius: var(--radius);
    }
    .tudo-feito__icone { font-size: 2.5rem; margin-bottom: 8px; }
    .tudo-feito__texto { font-size: 1.1rem; font-weight: 600; color: var(--success); }
    .tudo-feito__sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
    .tudo-feito__proximo {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #a5d6a7;
      font-size: 0.85rem;
      color: var(--text);
      line-height: 1.6;
    }

    /* ---- Progresso geral ---- */
    .progresso-geral {
      margin-bottom: 20px;
    }
    .progresso-geral__barra {
      height: 8px;
      background: var(--card-border);
      border-radius: 100px;
      overflow: hidden;
    }
    .progresso-geral__fill {
      height: 100%;
      border-radius: 100px;
      transition: width 0.4s ease;
    }
    .progresso-geral__texto {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 6px;
    }

    /* ---- Grupos de tarefa ---- */
    .grupo-tarefa {
      margin-bottom: 16px;
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 12px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
    }
    .grupo-tarefa--done {
      opacity: 0.65;
    }
    .grupo-tarefa--atrasado {
      border-color: #e57373;
      background: #fff5f5;
    }
    .grupo-tarefa--atrasado .grupo-tarefa__nome {
      color: #c62828;
    }
    .secao-titulo--atrasado {
      color: #c62828;
    }
    .grupo-tarefa__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--card-border);
    }
    .grupo-tarefa__nome {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--accent);
    }
    .grupo-tarefa__progresso {
      font-size: 0.8rem;
      color: var(--text-muted);
      background: var(--card-bg);
      padding: 2px 10px;
      border-radius: 100px;
    }
    .grupo-tarefa .tarefa-card {
      margin-bottom: 8px;
    }
    .grupo-tarefa .tarefa-card:last-child {
      margin-bottom: 0;
    }

    /* ---- Secao titulo ---- */
    .secao-titulo {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
      margin-top: 8px;
    }

    .secao-concluidos {
      margin-top: 20px;
    }
    .secao-concluidos__header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: var(--success-bg);
      border: 1px solid #a5d6a7;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 0.85rem;
      color: var(--success);
      -webkit-tap-highlight-color: transparent;
    }
    .secao-concluidos__seta {
      font-size: 0.7rem;
      color: var(--text-muted);
    }
    .secao-concluidos__lista {
      margin-top: 8px;
    }

    .estado-vazio__dica {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .tarefa-card__status {
      display: inline-block;
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 100px;
      margin-top: 8px;
      font-weight: 500;
    }

    .status--pendente {
      background: var(--pending-bg);
      color: var(--pending-text);
    }

    .status--concluido {
      background: var(--success-bg);
      color: var(--success);
    }

    /* ---- Acoes extras (obs, foto) ---- */
    .tarefa-card__acoes {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .tarefa-card__acoes .btn--sm {
      font-size: 0.8rem;
      padding: 6px 12px;
      border-radius: 6px;
    }

    .tarefa-card__obs-area {
      margin-top: 10px;
    }

    .tarefa-card__obs-area textarea {
      width: 100%;
      min-height: 60px;
      padding: 10px 12px;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      background: #fafafa;
      color: var(--text);
      font-family: var(--font);
      font-size: 0.85rem;
      resize: vertical;
      outline: none;
    }

    .tarefa-card__obs-area textarea:focus {
      border-color: var(--accent);
    }

    .tarefa-card__obs-area .btn {
      margin-top: 8px;
      width: auto;
      padding: 8px 16px;
      font-size: 0.8rem;
    }

    .tarefa-card__foto-preview {
      margin-top: 10px;
    }

    .tarefa-card__foto-preview img {
      max-width: 100%;
      max-height: 200px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
    }

    /* ---- Estados ---- */
    .estado-vazio {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    .estado-vazio__icone {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .estado-vazio__texto {
      font-size: 1rem;
    }

    .carregando {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ---- Toast ---- */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--success);
      color: #fff;
      padding: 12px 24px;
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 999;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
    }

    .toast--erro {
      background: #c0392b;
    }

    .toast--visivel {
      opacity: 1;
    }

    /* ---- File input escondido ---- */
    .input-foto-hidden {
      display: none;
    }
  </style>
</head>
<body>

  <!-- LOGIN -->
  <div class="login-screen" id="login-screen">
    <div class="login-card">
      <div class="login-header">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <polygon points="50,5 61,35 95,35 67,55 78,85 50,67 22,85 33,55 5,35 39,35" fill="#C45D3E"/>
        </svg>
        <h1>LABAREDA</h1>
        <p>Painel do Colaborador</p>
      </div>
      <div class="login-body">
        <form id="login-form" onsubmit="realizarLogin(event)">
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="seu@email.com" required autocomplete="email">
          </div>
          <div class="form-group">
            <label>Senha</label>
            <input type="password" id="login-senha" placeholder="Sua senha" required autocomplete="current-password">
          </div>
          <div class="login-error escondido" id="login-error"></div>
          <button type="submit" class="btn btn--primary" id="login-btn">Entrar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- APP (pos login) -->
  <div class="app-screen escondido" id="app-screen">

    <!-- Header fixo -->
    <div class="app-header">
      <div class="app-header__user">
        <span class="app-header__nome" id="header-nome"></span>
        <span class="app-header__data" id="header-data"></span>
      </div>
      <button class="btn-sair" onclick="realizarLogout()">Sair</button>
    </div>

    <!-- Barra de acoes -->
    <div class="barra-acoes">
      <span class="barra-acoes__contagem" id="contagem-tarefas"></span>
      <button class="btn btn--secondary btn--sm" onclick="carregarTarefas()">Atualizar</button>
    </div>

    <!-- Lista de tarefas -->
    <div id="lista-tarefas">
      <div class="carregando">Carregando tarefas...</div>
    </div>

  </div>

  <!-- Toast de feedback -->
  <div class="toast" id="toast"></div>

  <script src="./painel.js"></script>
</body>
</html>
